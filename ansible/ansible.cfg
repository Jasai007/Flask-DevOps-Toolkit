# =============================================================================
# ansible.cfg - project-level Ansible configuration (fully commented)
# =============================================================================
# WHERE SETTINGS COME FROM (precedence, highest wins):
#   1. Command-line flags       (-i, --limit, --vault-password-file, ...)
#   2. Environment variables    (ANSIBLE_CONFIG, ANSIBLE_ROLES_PATH, ...)
#   3. THIS FILE (./ansible.cfg)     <- auto-discovered from your cwd
#   4. ~/.ansible.cfg                <- per-user
#   5. /etc/ansible/ansible.cfg      <- system-wide
#
# VERIFY what is actually loaded:   ansible-config dump --only-changed
# (CONFIG_FILE should point at this file)
#
# TROUBLESHOOTING (WSL / Docker / world-writable dirs):
#   Ansible REFUSES to auto-load ./ansible.cfg when the current directory is
#   world-writable (mode 777). Typical on /mnt/<drive> in WSL because Windows
#   drives are mounted without POSIX metadata. If `ansible-config list` shows
#   "CONFIG_FILE: None" or the warning "world writable directory" appears:
#     a) quick fix :  source scripts/env.sh   (exports ANSIBLE_CONFIG for you)
#     b) permanent :  follow docs/wsl-notes.md  (/etc/wsl.conf metadata option)
# =============================================================================

[defaults]

# --- Inventory ---------------------------------------------------------------
# Static inventory used whenever no -i flag / ANSIBLE_INVENTORY is given.
# NOTE: relative paths resolve against your CURRENT WORKING DIRECTORY, so run
# commands from the project root (or use scripts/env.sh for absolute paths).
inventory = ./inventory/hosts

# --- Reusable automation search paths ---------------------------------------
# Where Ansible looks for Galaxy ROLES and COLLECTIONS.
# Separator is ':' on Linux/macOS/WSL and ';' on native Windows.
#   ./roles                 -> roles shipped with this project (committed)
#   ~/.ansible/roles        -> roles installed by `ansible-galaxy role install`
#   ./collections           -> the practice collection local.demo (committed)
#   ~/.ansible/collections  -> collections installed from requirements.yml
roles_path = ./roles:~/.ansible/roles
collections_path = ./collections:~/.ansible/collections

# --- Safety ------------------------------------------------------------------
# Lab/learning project: disabled so you can SSH to fresh hosts without
# interactive host-key prompts. For PRODUCTION set True (or remove this line)
# to protect against man-in-the-middle on first connection.
host_key_checking = False
# Ansible writes <playbook>.retry after a failure so you can re-run just the
# failed hosts. Disabled - modern workflow is: rerun with --limit <host>.
retry_files_enabled = False

# --- Interpreter discovery ---------------------------------------------------
# auto_silent = pick a Python interpreter on managed nodes automatically,
# without printing the "Python interpreter discovery" hint on every run.
interpreter_python = auto_silent

# --- Output ------------------------------------------------------------------
# default is the builtin human-readable callback. Others you can try:
#   ansible.builtin.minimal / oneline / tree   (builtin, no install needed)
#   community.general.yaml                     (pretty YAML blocks, needs the
#                                               community.general collection)
# Discover them all with:   ansible-doc -t callback -l
stdout_callback = default
display_skipped_hosts = True
# Keep deprecation warnings ON while learning - they tell you when syntax
# is being removed in future Ansible versions.
deprecation_warnings = True

# --- Performance -------------------------------------------------------------
# NOTE: ansible.cfg is INI - NO inline comments after a value, only full
# comment lines like this one.
forks = 20
timeout = 30

# --- Vault (DEMO ONLY) -------------------------------------------------------
# Uncomment the next line to skip typing --vault-password-file when running
# playbooks/16_vault.yml. NEVER point this at a real production password file
# and never commit real passwords - scripts/vault_pass_demo.txt exists only
# for this learning project.

# vault_password_file = scripts/vault_pass_demo.txt

# --- Interesting settings to experiment with (see docs/cheatsheet.md) --------
# stdout_callback = community.general.yaml   # prettier task output
# callbacks_enabled = ansible.posix.timer    # per-play runtime report
# error_on_undefined_vars = True             # fail on variable typos (strict)
# nocows = True                              # strip box-drawing from help text
# display_skipped_hosts = False              # quieter output
# gathering = explicit                       # skip facts unless asked (faster)

